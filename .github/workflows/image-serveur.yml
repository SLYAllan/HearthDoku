name: Image du serveur WS

# Le front part sur GitHub Pages par deploy-pages.yml ; seul le serveur WS a une image.
on:
  push:
    branches: [main]
    paths: ['server/**', 'compose.dokploy.yaml', '.github/workflows/image-serveur.yml']
  pull_request:
    paths: ['server/**', 'compose.dokploy.yaml', '.github/workflows/image-serveur.yml']

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/slyallan/hearthdoku-ws
      PUBLIER: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - name: Le compose de Dokploy passe chaque variable que lit le serveur
        run: |
          # WS_PORT n'est qu'un ancien nom de PORT, lu en second.
          attendu=$(grep -hoE 'process\.env\.[A-Z0-9_]+' server/*.js | cut -d. -f3 \
            | grep -vx WS_PORT | sort -u)
          config=$(CORS_ORIGIN=https://exemple.invalid docker compose -f compose.dokploy.yaml config --format json)
          diff <(echo "$attendu") <(jq -r '.services.ws.environment | keys[]' <<< "$config" | sort)
          jq -e '.services.ws.image == "ghcr.io/slyallan/hearthdoku-ws:main"' <<< "$config"
      - name: Le compose refuse un CORS_ORIGIN absent
        run: |
          # Sans elle, le serveur accepte toutes les origines ('*').
          if docker compose -f compose.dokploy.yaml config > /dev/null 2>&1; then
            echo "CORS_ORIGIN absente et pourtant acceptée"; exit 1
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: server
          load: true
          tags: hearthdoku-ws:essai
          labels: org.opencontainers.image.source=https://github.com/SLYAllan/HearthDoku
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Node 24 dans l'image
        run: docker run --rm hearthdoku-ws:essai node --version | grep -q '^v24\.'
      - name: Le serveur répond sur /health
        run: |
          docker run -d --name ws -p 127.0.0.1:18080:8080 hearthdoku-ws:essai
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/health && exit 0
            sleep 1
          done
          docker logs ws
          exit 1
      - if: env.PUBLIER == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publication
        if: env.PUBLIER == 'true'
        run: |
          for tag in "${{ github.sha }}" main; do
            docker tag hearthdoku-ws:essai "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
